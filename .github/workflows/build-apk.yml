
name: Build Rappo GPT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir source
          unzip -o RappoGPT-Android-Project-1.zip -d source

      - name: Build APK
        working-directory: source
        run: gradle assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: RappoGPT-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
